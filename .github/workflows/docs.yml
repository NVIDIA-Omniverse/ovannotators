name: Build and Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. Do not cancel an in-progress deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.10

      - name: Install documentation dependencies
        run: uv sync --extra dev-cpu

      - name: Build documentation
        run: uv run sphinx-build -W -b html docs/public _build/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/docs

  deploy:
    # Deploy only public main, not pull-request previews.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
